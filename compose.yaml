# CampusClaw: one browser entry point, everything else internal.
#
# Copy .env.example to .env and fill in every value first; the ${VAR:?} forms
# below abort the start with a clear message when one is missing, which is what
# keeps a half-configured stack from booting.
#
# The project name is pinned so this stack can never share volumes or a network
# with another Compose project on the same machine.

name: campusclaw-zwh

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # Pinned so the keyword index and the queries that use it cannot drift
      # apart: the value is read once at startup and is not settable per session.
      - --ngram-token-size=2
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # The password is read from the container's own environment rather than
      # interpolated here, so it never appears in the Compose configuration.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # Deliberately no ports: the database is reachable only on the internal
    # network, by service name.

  # The vector index. Chunk text stays in MySQL; only the vectors and the five
  # identifying fields live here, so a citation is never reconstructed from this
  # store alone.
  qdrant:
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    # Deliberately no ports: only the API container may reach the collection.
    # The image ships no healthcheck, so readiness is proven by the API's own
    # collection preparation instead.

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: "8081"
      UPLOAD_DIR: /uploads

      # Default to the Compose service name; .env may override if the database
      # is reached some other way.
      MYSQL_HOST: ${MYSQL_HOST:-db}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}

      # The vector store is reached by service name and never published.
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-campusclaw_chunks}

      # Server-side model gateways. The keys live here and nowhere else: the
      # browser only ever talks to this API's /api routes.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:?EMBEDDING_BASE_URL is required}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?EMBEDDING_MODEL is required}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:?EMBEDDING_DIMENSIONS is required}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:?EMBEDDING_API_KEY is required}
      CHAT_BASE_URL: ${CHAT_BASE_URL:?CHAT_BASE_URL is required}
      CHAT_MODEL: ${CHAT_MODEL:?CHAT_MODEL is required}
      CHAT_API_KEY: ${CHAT_API_KEY:?CHAT_API_KEY is required}

      SEED_TEACHER_A_PASSWORD: ${SEED_TEACHER_A_PASSWORD:?SEED_TEACHER_A_PASSWORD is required}
      SEED_STUDENT_A1_PASSWORD: ${SEED_STUDENT_A1_PASSWORD:?SEED_STUDENT_A1_PASSWORD is required}
      SEED_TEACHER_B_PASSWORD: ${SEED_TEACHER_B_PASSWORD:?SEED_TEACHER_B_PASSWORD is required}
      SEED_STUDENT_B1_PASSWORD: ${SEED_STUDENT_B1_PASSWORD:?SEED_STUDENT_B1_PASSWORD is required}

      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      DEV_PUBLIC_ORIGIN: ${DEV_PUBLIC_ORIGIN:-}
    volumes:
      - uploads:/uploads
    depends_on:
      db:
        # Migrations and the seed run only once the database is answering.
        condition: service_healthy
      qdrant:
        # Started, not healthy: the image publishes no healthcheck, and the API
        # prepares the collection itself once the store answers.
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s

    # One CPU is enough for a teaching pilot, and the caps keep a hostile
    # document from taking the host down with it.
    mem_limit: 512m
    cpus: 1
    pids_limit: 64
    # No ports: the API is reachable only through the web tier.

  web:
    build:
      # Root context so the image can also copy deploy/nginx.conf.
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # The single published port for the whole system.
      - "8080:80"
    # Deliberately no uploads volume: the web tier must never be able to read
    # stored originals directly.

volumes:
  db_data:
  uploads:
  # The vectors outlive a container rebuild; losing them only costs a reindex,
  # because the chunk text they point at is still in MySQL.
  qdrant_data:
