# The only browser-facing tier. It serves the React build, proxies the API and
# the health probe, and refuses to serve stored originals.
#
# There is no CORS configuration anywhere: the browser talks to one origin, and
# cross-origin mutation attempts are rejected by the API's own origin check.

# The file is included from nginx's http context, where a shared rate zone
# can be defined. Use the direct peer address, never a client-supplied header.
limit_req_zone $binary_remote_addr zone=campusclaw_login:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mirrors the API's own request ceiling. Equal limits plus the JSON error
    # page below mean an oversized upload is still answered in the API's shape
    # rather than as an nginx HTML page.
    client_max_body_size 6m;

    # Rate the API's error responses as JSON even when nginx produces them.
    error_page 413 = @json_payload_too_large;

    location @json_payload_too_large {
        default_type application/json;
        return 413 '{"error":{"code":"payload_too_large","message":"请求内容过大"}}';
    }

    location @json_rate_limited {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"error":{"code":"rate_limited","message":"\u8bf7\u6c42\u8fc7\u4e8e\u9891\u7e41\uff0c\u8bf7\u7a0d\u540e\u91cd\u8bd5"}}';
    }

    # An exact location leaves the generic /api/ routes unaffected. Both
    # successful and failed logins use the same per-peer budget.
    location = /api/login {
        limit_req zone=campusclaw_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @json_rate_limited;

        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Stored originals are private. Answering 404 rather than 403 avoids
    # confirming that a given path exists.
    location = /uploads {
        return 404;
    }

    location ^~ /uploads/ {
        return 404;
    }

    # Exact match, so the probe is proxied instead of falling through to the
    # SPA and returning index.html.
    location = /health {
        proxy_pass http://api:8081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Path is forwarded unchanged: /api/materials/7 arrives as
    # /api/materials/7, and an unknown /api path is answered by the API's JSON
    # 404 rather than by the SPA.
    location /api/ {
        proxy_pass http://api:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Matches the API's own WriteTimeout so a slow parse and its
        # transaction have the same budget on both sides.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # SPA fallback for client-side routes, evaluated after the API and uploads
    # rules above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
